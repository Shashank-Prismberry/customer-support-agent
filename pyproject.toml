[project]
name = "customer-support-agent"
version = "0.1.0"
description = "LangGraph orchestration component for the customer support AI system"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.14.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "support_agent"
module-root = "src"
